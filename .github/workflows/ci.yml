# ============================================================================
# Basic CI for DeQA-Doc
# ============================================================================
# Lightweight checks suited for a research codebase with heavy GPU deps.
# Tests requiring torch/CUDA are excluded — run those locally with GPU.
# ============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install linting tools
        run: uv tool install ruff && uv tool install bandit

      # Lint new/local code only (not upstream DeQA-Score or Llamafactory)
      - name: Ruff format check (results/)
        run: |
          if [ -d results/ ]; then
            ruff format --check results/ || echo "::warning::Formatting issues in results/"
          fi

      - name: Ruff lint (results/)
        run: |
          if [ -d results/ ]; then
            ruff check results/ --output-format=github || echo "::warning::Lint issues in results/"
          fi

      - name: Python syntax check (all .py files)
        run: |
          echo "Checking Python syntax..."
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" | \
            xargs python -m py_compile 2>&1 | tee /tmp/syntax.log || true
          if [ -s /tmp/syntax.log ]; then
            echo "::warning::Syntax issues found — see log above"
          fi

      - name: Bandit security scan (results/)
        run: |
          if [ -d results/ ]; then
            bandit -r results/ -ll || echo "::warning::Security issues in results/"
          fi

      - name: Check for secrets/credentials
        run: |
          echo "Scanning for potential secrets..."
          FOUND=0
          # Check for hardcoded API keys/tokens
          if grep -rE "(api_key|api_secret|password|token)\s*=\s*[\"'][^\"']{8,}[\"']" \
               --include="*.py" --include="*.sh" --include="*.yaml" --include="*.yml" \
               --exclude-dir=.git --exclude-dir=tests . 2>/dev/null; then
            echo "::error::Potential hardcoded secret detected"
            FOUND=1
          fi
          # Check for .env committed
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No secrets detected."

  # CodeQL security analysis is handled by GitHub's default setup.
  # Do not add an advanced CodeQL configuration here — it conflicts
  # with the default setup and causes SARIF upload failures.

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
