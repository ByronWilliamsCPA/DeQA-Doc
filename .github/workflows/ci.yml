# ============================================================================
# Basic CI for DeQA-Doc
# ============================================================================
# Lightweight checks suited for a research codebase with heavy GPU deps.
# Tests requiring torch/CUDA are excluded; run those locally with GPU.
# ============================================================================

name: CI

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Permissions are declared per-job (least privilege) rather than workflow-wide,
# per githubactions:S8264 and the org workflow-permissions standard.
jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install linting tools
        run: uv tool install ruff && uv tool install bandit

      # Lint new/local code only (not upstream DeQA-Score or Llamafactory)
      - name: Ruff format check (results/)
        run: |
          if [ -d results/ ]; then
            ruff format --check results/ || echo "::warning::Formatting issues in results/"
          fi

      - name: Ruff lint (results/)
        run: |
          if [ -d results/ ]; then
            ruff check results/ --output-format=github || echo "::warning::Lint issues in results/"
          fi

      - name: Python syntax check (all .py files)
        run: |
          echo "Checking Python syntax..."
          find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" | \
            xargs python -m py_compile 2>&1 | tee /tmp/syntax.log || true
          if [ -s /tmp/syntax.log ]; then
            echo "::warning::Syntax issues found; see log above"
          fi

      - name: Bandit security scan (results/)
        run: |
          if [ -d results/ ]; then
            bandit -r results/ -ll || echo "::warning::Security issues in results/"
          fi

      - name: Check for secrets/credentials
        run: |
          echo "Scanning for potential secrets..."
          FOUND=0
          # Check for hardcoded API keys/tokens
          if grep -rE "(api_key|api_secret|password|token)\s*=\s*[\"'][^\"']{8,}[\"']" \
               --include="*.py" --include="*.sh" --include="*.yaml" --include="*.yml" \
               --exclude-dir=.git --exclude-dir=tests . 2>/dev/null; then
            echo "::error::Potential hardcoded secret detected"
            FOUND=1
          fi
          # Check for .env committed
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env file is tracked by git"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No secrets detected."

  # CodeQL security analysis is handled by GitHub's default setup.
  # Do not add an advanced CodeQL configuration here; it conflicts
  # with the default setup and causes SARIF upload failures.

  # actions/dependency-review-action was removed fleet-wide: GitHub now bills
  # Advanced Security (Code Security) for this action, so it no longer runs
  # on repos without that add-on. The standalone "Dependency Review" job that
  # used to live here is gone; the gate below now validates Quality Checks
  # only.

  # Aggregating gate that emits the exact context required by the org ruleset
  # (ByronWilliamsCPA-default-branch-baseline). For a non-reusable job the
  # required-check context equals the job name verbatim, so this job stays
  # named "Dependency & Standards Validation" even though it now gates only
  # the quality job (renaming would break the required status check).
  dependency-standards-validation:
    name: Dependency & Standards Validation
    runs-on: ubuntu-latest
    needs: [quality]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Validate dependency and standards checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          echo "Quality Checks:    $QUALITY_RESULT"
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "::error::Dependency & Standards Validation failed: Quality Checks result is $QUALITY_RESULT"
            exit 1
          fi
          echo "Dependency & Standards Validation passed"
