# Security Analysis Workflow
# Delegates security scans to the org-level reusable workflow.
name: Security Analysis

on:
  merge_group:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly scan on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: Security Analysis
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@7d12f5486ab5c856397ebaa4acd3c99ca385227c # main
    with:
      python-version: "3.12"
      run-safety: false
      run-codeql: false
      run-dependency-review: false
      run-osv: false
      run-bandit: false

  security-gate-validation:
    # Job name is set to the exact context string required by the org ruleset
    # (ByronWilliamsCPA-default-branch-baseline). For a non-reusable job the
    # required-check context equals this name verbatim, so it must be named
    # exactly "Security Gate Validation" (the bare context the ruleset requires).
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - name: Check security scan results
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "::error::Security Gate Validation failed: security scan result is $SECURITY_RESULT"
            exit 1
          fi
          echo "Security Gate Validation passed"
