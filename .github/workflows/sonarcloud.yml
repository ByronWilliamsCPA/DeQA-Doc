---
# Merge-queue shim for the required "SonarCloud Code Analysis" context.
# SonarCloud's GitHub App posts that status on pull_request events only; on
# merge_group refs it never reports, so without this job the merge queue waits
# the full timeout and then fails the entry. The org ruleset pins no
# integration_id to this context, so a GitHub Actions job named exactly
# "SonarCloud Code Analysis" legitimately satisfies it on the queued commit.
# The real quality gate already ran and passed on the PR under this same
# required context. This workflow runs on merge_group ONLY so it does not
# create a duplicate context on pull_request (where the App already posts it).
name: SonarCloud Merge Queue Gate

on:
  merge_group:

permissions:
  contents: read

jobs:
  sonarcloud-merge-queue-gate:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit
      - name: Confirm SonarCloud gate (validated on the PR)
        run: |
          echo "SonarCloud quality gate validated at PR time under this same"
          echo "required context. SonarCloud does not report on merge_group refs,"
          echo "so this job satisfies the merge-queue required check."
