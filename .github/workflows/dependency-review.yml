# Dependency Review - Analyzes dependency changes in PRs
# Checks for vulnerabilities and license compliance
#
# Features:
#   - Vulnerability detection in dependency changes
#   - License compliance checking
#   - Blocks PRs with high severity vulnerabilities
name: Dependency Review

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # MIT-CMU and HPND are Pillow's SPDX license identifiers (permissive,
          # OSI-style); added so raising the Pillow security floor does not trip
          # the license gate.
          allow-licenses: MIT, MIT-CMU, HPND, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, LGPL-2.1, LGPL-3.0, Python-2.0, Unlicense, CC0-1.0, GPL-3.0-or-later
          # Accepted residual: deepspeed (training-only) has no release that
          # both fixes this RCE (<0.15.1) and keeps pydantic<2. Tracked in
          # docs/known-vulnerabilities.md (reassess 2026-07-27).
          allow-ghsas: GHSA-8cp5-3rf8-8gfh
          comment-summary-in-pr: on-failure
