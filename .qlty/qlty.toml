config_version = "0"

exclude_patterns = [
  # Build artifacts and dependencies
  "**/build/**",
  "**/dist/**",
  "**/*.egg-info/**",
  "**/.venv/**",

  # Cache directories
  "**/.mypy_cache/**",
  "**/.ruff_cache/**",
  "**/.pytest_cache/**",
  "**/__pycache__/**",

  # Claude and temp directories
  "**/.claude/**",
  "**/tmp_cleanup/**",

  # Generated and data files
  "*.lock",
  "**/htmlcov/**",
  "**/.coverage",

  # Model checkpoints and large files
  "*.pth",
  "*.pt",
  "*.bin",
  "**/preprocessor/**",

  # Standard exclusions
  "**/node_modules/**",
  "**/vendor/**",
  "**/target/**",

  # Upstream DeQA-Score code — uses its own style, Chinese comments
  "DeQA-Score/src/conversation.py",
  "DeQA-Score/src/datasets/**",
  "DeQA-Score/src/evaluate/**",
  "DeQA-Score/src/model/**",
  "DeQA-Score/src/train/**",
  "DeQA-Score/src/mm_utils.py",
  "DeQA-Score/build_soft_labels/**",
  "DeQA-Score/scripts/**",

  # Research experiment scripts — one-off analysis, not production code
  "research/**",
  "modal/**",
  "results/**",

  # Upstream Llamafactory patches
  "Llamafactory/**",

  # Data expansion scripts — experimental pipeline
  "DeQA-Score/src/expansion/**",
  "DeQA-Score/tests/expansion/**",

  # Project docs with complex tables
  "PROJECT_REVIEW_REPORT.md",
  "docs/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/*.test.*",
  "**/test_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# ---------------------------------------------------------------------------
# Plugin configuration
# ---------------------------------------------------------------------------

# Python security scanning handled by CI workflow (bandit in ci.yml)
# Not enabled here — B101 false positives on pytest assert statements

# Dependency vulnerability scanning
[[plugin]]
name = "trivy"
drivers = ["config"]

# Python quality (SonarQube rules)
[[plugin]]
name = "radarlint-python"
mode = "comment"

# Text pattern detection (TODO/NOTE)
[[plugin]]
name = "ripgrep"
mode = "comment"

# Python formatting & linting
[[plugin]]
name = "ruff"
drivers = ["lint"]

# Secrets detection
[[plugin]]
name = "trufflehog"

# Markdown documentation linting
[[plugin]]
name = "markdownlint"
mode = "comment"
