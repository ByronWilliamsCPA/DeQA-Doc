config_version = "0"

exclude_patterns = [
  # Build artifacts and dependencies
  "**/build/**",
  "**/dist/**",
  "**/*.egg-info/**",
  "**/.venv/**",

  # Cache directories
  "**/.mypy_cache/**",
  "**/.ruff_cache/**",
  "**/.pytest_cache/**",
  "**/__pycache__/**",

  # Claude and temp directories
  "**/.claude/**",
  "**/tmp_cleanup/**",

  # Generated and data files
  "*.lock",
  "**/htmlcov/**",
  "**/.coverage",

  # Model checkpoints and large files
  "*.pth",
  "*.pt",
  "*.bin",
  "**/preprocessor/**",

  # Standard exclusions
  "**/node_modules/**",
  "**/vendor/**",
  "**/target/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/*.test.*",
  "**/test_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

# ---------------------------------------------------------------------------
# Plugin configuration
# ---------------------------------------------------------------------------

# Python security scanning
[[plugin]]
name = "bandit"

# Dependency vulnerability scanning
[[plugin]]
name = "trivy"
drivers = ["config"]

# Python quality (SonarQube rules)
[[plugin]]
name = "radarlint-python"
mode = "comment"

# Text pattern detection (TODO/NOTE)
[[plugin]]
name = "ripgrep"
mode = "comment"

# Python formatting & linting
[[plugin]]
name = "ruff"
drivers = ["lint"]

# Secrets detection
[[plugin]]
name = "trufflehog"

# Markdown documentation linting
[[plugin]]
name = "markdownlint"
mode = "comment"
