config_version = "0"

[smells]
mode = "comment"

exclude_patterns = [
  # Build artifacts and dependencies
  "build/",
  "dist/",
  "*.egg-info/",
  ".venv/",

  # Cache directories
  ".mypy_cache/",
  ".ruff_cache/",
  ".pytest_cache/",
  "__pycache__/",

  # Claude and temp directories
  "**/.claude/**",
  "tmp_cleanup/",

  # Generated and data files
  "*.lock",
  "htmlcov/",
  ".coverage",

  # Model checkpoints and large files
  "*.pth",
  "*.pt",
  "*.bin",
  "preprocessor/",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/*.test.*",
  "**/test_*.*",
]

# ---------------------------------------------------------------------------
# Plugin configuration
# ---------------------------------------------------------------------------

# GitHub Actions linting
[[plugin]]
name = "actionlint"

# Python security scanning
[[plugin]]
name = "bandit"

[plugin.exclusions]
- = "tests/**"
- = "**/test_*.py"

# Dependency vulnerability scanning
[[plugin]]
name = "osv-scanner"

# Python quality (SonarQube rules)
[[plugin]]
name = "radarlint-python"
mode = "comment"

# Text pattern detection (TODO/NOTE)
[[plugin]]
name = "ripgrep"
mode = "comment"

# Python formatting & linting
[[plugin]]
name = "ruff"
driver = "lint"

# Secrets detection
[[plugin]]
name = "trufflehog"

# Markdown documentation linting
[[plugin]]
name = "markdownlint"

# YAML configuration linting
[[plugin]]
name = "yamllint"

# ---------------------------------------------------------------------------
# Triage rules (suppress known false positives)
# ---------------------------------------------------------------------------

# Standard pytest assertions
[[triage]]
rule = "bandit:B101"
level = "ignore"

# TODO/NOTE comments are informational
[[triage]]
rule = "ripgrep:TODO"
level = "ignore"

[[triage]]
rule = "ripgrep:NOTE"
level = "ignore"

[[triage]]
rule = "radarlint-python:S1135"
level = "ignore"

# Upstream DeQA-Score code uses its own style — suppress formatting noise
# Only enforce ruff on new code (results/, new scripts)
[[triage]]
rule = "ruff:E501"
level = "ignore"
path = "DeQA-Score/src/**"

[[triage]]
rule = "ruff:E501"
level = "ignore"
path = "Llamafactory/**"
