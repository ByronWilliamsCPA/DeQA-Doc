[project]
name = "ocr-iqa-correlation"
version = "0.1.0"
description = "Test dataset correlating OCR accuracy (CER/WER) with document image quality scores"
requires-python = ">=3.10"
dependencies = [
    "jiwer>=3.0",
    "datasets>=2.14",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
distortion = [
    "augraphy>=8.0",
    "albumentations>=1.3",
]
ocr = [
    "docling>=2.0",
    "google-cloud-vision>=3.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
