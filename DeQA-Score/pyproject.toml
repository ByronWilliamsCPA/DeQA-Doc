[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DeQA-Score"
version = "1.2.0"
description = "Teaching Large Language Models to Regress Accurate Image Quality Scores using Score Distribution (based on mPLUG-Owl2)"
readme = "README.md"
requires-python = ">=3.8,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "transformers==4.36.1",
    "tokenizers==0.15.0",
    "sentencepiece==0.1.99",
    "shortuuid",
    "accelerate==0.21.0",
    "peft==0.4.0",
    "bitsandbytes==0.41.0",
    "pydantic<2,>=1",
    "markdown2[all]",
    "numpy",
    "scikit-learn==1.2.2",
    "gradio==3.35.2",
    "gradio_client==0.2.9",
    "requests",
    "httpx>=0.24.0",
    "uvicorn",
    "fastapi",
    "icecream",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==0.6.13",
    "decord",
    "scipy",
]

[project.optional-dependencies]
train = ["deepspeed==0.15.1", "ninja", "wandb"]
dev = ["pytest", "ruff", "protobuf"]
api = ["anthropic>=0.43.0", "openai>=1.0.0"]

[project.urls]
"Bug Tracker" = "https://github.com/zhiyuanyou/DeQA-Score/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.uv]
# torch 2.0.1 only has wheels for Python 3.8-3.11
python-preference = "managed"

[tool.uv.sources]
# Use PyTorch's official index for CUDA wheels
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
