[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DeQA-Score"
version = "1.2.0"
description = "Teaching Large Language Models to Regress Accurate Image Quality Scores using Score Distribution (based on mPLUG-Owl2)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.0.1",
    "torchvision==0.15.2",
    "transformers==4.36.1",
    "tokenizers==0.15.0",
    "sentencepiece==0.1.99",
    "shortuuid",
    "accelerate==0.21.0",
    "peft==0.4.0",
    "bitsandbytes==0.49.2",
    "pydantic<2,>=1",
    "markdown2[all]",
    "numpy",
    "scikit-learn==1.2.2",
    "requests",
    "httpx>=0.24.0",
    "uvicorn",
    "fastapi",
    "icecream",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==0.6.13",
    "decord",
    "scipy",
    # Security floors for transitive deps (pulled in via transformers,
    # huggingface_hub, matplotlib, etc.). Raised to the nearest non-vulnerable
    # release compatible with the pinned core (torch/transformers, pydantic<2).
    # requires-python is >=3.10,<3.12 (the torch 2.0.1 cu118 wheel range, real
    # runtime 3.11), so every floor below resolves unconditionally to its
    # patched release with no vulnerable py3.8/3.9 fallback; see
    # docs/known-vulnerabilities.md for remaining residuals.
    "idna>=3.15",
    "pillow>=12.2.0",
    "GitPython>=3.1.50",
    "h11>=0.16.0",
    "certifi>=2024.7.4",
    "pygments>=2.20.0",
    "requests>=2.34.2",
    "starlette>=0.49.3",
    "urllib3>=2.7.0",
    "filelock>=3.20.1",
]

[project.optional-dependencies]
train = ["deepspeed==0.14.5", "ninja", "wandb"]
dev = ["pytest>=9.0.3", "ruff", "protobuf"]
api = ["anthropic>=0.43.0", "openai>=1.0.0"]
# NOTE: gradio (the upstream mPLUG-Owl2 web demo / gradio_web_server) was
# removed entirely. It is not imported or invoked by any train/infer/eval code
# path in this fork (the only reference, `Conversation.to_gradio_chatbot` in
# src/conversation.py, builds an HTML string and does not import gradio). The
# old gradio==3.35.2 carried 70+ CVEs. A secure gradio (5.x/6.x) cannot be
# added even as an optional extra because it requires pydantic>=2, which
# conflicts with the pinned pydantic<2 the mPLUG-Owl2 stack depends on. If the
# upstream demo is ever needed, install a secure gradio in a separate
# environment that does not pin pydantic<2. See docs/known-vulnerabilities.md.

[project.urls]
"Bug Tracker" = "https://github.com/zhiyuanyou/DeQA-Score/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.uv]
# torch 2.0.1 only has wheels for Python 3.8-3.11; requires-python is pinned to
# >=3.10,<3.12 above so resolution always finds a compatible cu118 wheel.
python-preference = "managed"

[tool.uv.sources]
# Use PyTorch's official index for CUDA wheels
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
